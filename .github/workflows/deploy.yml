name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_OAUTH_PROVIDERS: ${{ vars.VITE_SUPABASE_OAUTH_PROVIDERS || 'google,github' }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve Supabase project ref
        run: |
          value="${SUPABASE_PROJECT_ID}"
          if [[ "$value" =~ ^[a-z0-9]{20}$ ]]; then
            ref="$value"
          elif [[ "$value" =~ ^https?://([a-z0-9]{20})\.supabase\.co/?$ ]]; then
            ref="${BASH_REMATCH[1]}"
          elif [[ "$value" =~ /project/([a-z0-9]{20})(/|$) ]]; then
            ref="${BASH_REMATCH[1]}"
          else
            echo "::error::SUPABASE_PROJECT_ID must be the 20-character Supabase project ref, for example abcdefghijklmnopqrst. You can find it in Project Settings -> General -> Reference ID, or in https://supabase.com/dashboard/project/<ref>."
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy auth-register --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy auth-password-login --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy profile-sync --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy random-pick --project-ref "$SUPABASE_PROJECT_REF"

      - name: Build static app
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
